<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

<div class="min-h-screen flex items-center justify-center bg-[#b8c5d1]">
  <div class="bg-white rounded-lg shadow-md p-8 w-[400px]">
    <div class="flex justify-start mb-4">
      <img
        src="https://150698241.v2.pressablecdn.com/retail/wp-content/uploads/sites/358/2025/07/retail-321.png"
        alt="Retail Logo"
        class="h-10"
      />
    </div>

    <div class="flex mb-6">
      <button
        class="flex-1 bg-white border border-gray-300 text-[#292042] py-2"
        (click)="goToLogin()"
      >
        Login
      </button>
      <button
        class="flex-1 bg-[#292042] text-white py-2"
        disabled
      >
        Sign Up
      </button>
    </div>

    <form (submit)="signup(); $event.preventDefault()">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Email address <span class="text-red-500">*</span>
      </label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        class="w-full border border-gray-300 p-2 mb-4 rounded"
      />

      <label class="block text-sm font-medium text-gray-700 mb-1">
        Password <span class="text-red-500">*</span>
      </label>

      <style>
      /* Hides default reveal (eye) icon in Edge and IE */
      input::-ms-reveal,
      input::-ms-clear {
        display: none;
      }

      /* Hides password reveal icon in Chrome */
      input::-webkit-credentials-auto-fill-button,
      input::-webkit-textfield-decoration-container {
        display: none !important;
      }
      </style>

      <div class="relative">
        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          class="w-full border border-gray-300 rounded py-2 px-3 pr-12"
          autocomplete="off"
        />
        <button
          type="button"
          class="absolute right-3 top-2.5 text-gray-500 focus:outline-none"
          (click)="togglePasswordVisibility()"
        >
          <i
            class="fas"
            [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
          ></i>
        </button>
      </div>

      <div class="flex items-center action-row mt-6 gap-4">
        <button
          type="submit"
          class="bg-[#292042] text-white py-2 px-6 rounded text-sm font-semibold"
        >
          Sign Up
        </button>
        <label class="text-sm text-gray-700 flex items-center">
          <input
            type="checkbox"
            class="mr-2"
            name="rememberMe"
            [(ngModel)]="rememberMe"
          />
          Remember me
        </label>
      </div>

      <div
        class="mt-4 text-sm text-blue-600 underline cursor-pointer"
        (click)="goToLogin()"
      >
        Already have an account?
      </div>
    </form>
  </div>
</div>
