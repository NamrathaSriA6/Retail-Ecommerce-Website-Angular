<div class="min-h-screen flex items-center justify-center bg-[#b8c5d1]">
  <div class="bg-white p-6 rounded shadow-md w-[400px]">
    <h2 class="text-xl font-semibold mb-4 text-[#292042]">Forgot Password</h2>

    <!-- STEP 1: EMAIL CHECK -->
    <div *ngIf="step === 1">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Enter your registered email
      </label>
      <input type="email" [(ngModel)]="email" class="w-full border border-gray-300 p-2 rounded mb-3" />
      <button (click)="checkEmail()" class="bg-[#292042] text-white py-2 px-4 rounded w-full">
        Next
      </button>
    </div>

    <!-- STEP 2: RESET PASSWORD -->
    <div *ngIf="step === 2">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        New Password
      </label>
      <input type="password" [(ngModel)]="newPassword" class="w-full border border-gray-300 p-2 rounded mb-3" />

      <label class="block text-sm font-medium text-gray-700 mb-1">
        Confirm Password
      </label>
      <input type="password" [(ngModel)]="confirmPassword" class="w-full border border-gray-300 p-2 rounded mb-3" />

      <button (click)="updatePasswordManually()" class="bg-[#292042] text-white py-2 px-4 rounded w-full">
        Update Password
      </button>
    </div>

    <!-- MESSAGES -->
    <p *ngIf="message" class="text-green-600 mt-2 text-sm">{{ message }}</p>
    <p *ngIf="error" class="text-red-600 mt-2 text-sm">{{ error }}</p>

    <button (click)="goToLogin()" class="mt-4 text-blue-600 underline text-sm">
      ← Back to Login
    </button>
  </div>
</div>
