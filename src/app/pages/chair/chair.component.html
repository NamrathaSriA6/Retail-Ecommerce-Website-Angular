<div class="flex">
  <!-- Sidebar Filters -->
  <aside class="sticky top-0 w-64 bg-white border-r border-gray-200 p-4 overflow-y-auto h-screen">
    <h1 class="text-xl font-bold mb-4">Chair</h1>
    <h2 class="text-l font-bold mb-4">Filters</h2>

    <!-- Price Filter -->
    <div class="mb-6">
      <h3 class="font-semibold mb-2">Price</h3>
      <input type="range" min="27" max="400" class="w-full">
      <div class="flex justify-between text-sm mt-1">
        <span>₹99</span>
        <span>₹999</span>
      </div>
    </div>

   
   
  </aside>

  <!-- Product Grid -->
  <div class="flex-1 overflow-y-auto p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    
    <!-- Product Card -->
    <div class="border border-gray-200 rounded-lg p-4 bg-white shadow-sm flex flex-col items-center">
      <a [routerLink]="['/chairu']" class="img-link">
      <img src="assets/chair.png" alt="Product" class="w-full h-48 object-contain mb-4">
      </a>
      <h4 class="font-medium text-center">Morbhi mattis</h4>
      <p class="text-gray-600 text-center">₹33.00</p>
      <div class="flex justify-center gap-2 mt-4">
        <button class="bg-purple-900 p-2 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9m13-9l2 9m-5-4a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </button>
        <button class="bg-purple-900 p-2 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
        </button>
        <button class="bg-gray-200 text-gray-700 px-3 py-1 rounded font-medium text-sm">Compare</button>
      </div>
    </div>

    <!-- Repeat Cards -->
    <div class="border border-gray-200 rounded-lg p-4 bg-white shadow-sm flex flex-col items-center">
      <img src="assets/chair2.png" alt="Product" class="w-full h-48 object-contain mb-4">
      <h4 class="font-medium text-center">Nulla faugat</h4>
      <p class="text-gray-600 text-center">₹50.00 – ₹99.00</p>
      <div class="flex justify-center gap-2 mt-4">
        <button class="bg-purple-900 p-2 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9m13-9l2 9m-5-4a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </button>
        <button class="bg-purple-900 p-2 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
        </button>
        <button class="bg-gray-200 text-gray-700 px-3 py-1 rounded font-medium text-sm">Compare</button>
      </div>
    </div>

    <div class="border border-gray-200 rounded-lg p-4 bg-white shadow-sm flex flex-col items-center">
      <img src="assets/chair3.png" alt="Product" class="w-full h-48 object-contain mb-4">
      <h4 class="font-medium text-center">phasellus mole</h4>
      <p class="text-gray-600 text-center">₹50.00 – ₹99.00</p>
      <div class="flex justify-center gap-2 mt-4">
        <button class="bg-purple-900 p-2 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9m13-9l2 9m-5-4a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </button>
        <button class="bg-purple-900 p-2 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
        </button>
        <button class="bg-gray-200 text-gray-700 px-3 py-1 rounded font-medium text-sm">Compare</button>
      </div>
    </div>   
  </div>
  
</div>
