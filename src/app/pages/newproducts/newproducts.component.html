<div class="w-full py-6 px-2 sm:px-4 md:px-6">
  <div class="flex flex-col md:flex-row w-full gap-4">

    <!-- Sidebar Filters -->
    <aside class="sticky top-[100px] self-start w-full md:w-[390px] px-2 hidden md:block">
      <h1 class="text-3xl font-semibold mb-4">New Products</h1>
      <h2 class="text-sm text-gray-600 mb-6">Home / New Products</h2>
      
      <!-- Price Filter -->
      <div class="mb-8">
        <h3 class="text-lg font-semibold mb-2">Price</h3>
        <input type="range" min="0" max="1500" [(ngModel)]="maxPrice" 
          class="w-full accent-black h-[4px]" />
        <div class="flex justify-between mt-2">
          <div class="border px-4 py-2 text-sm">₹{{ minPrice }}</div>
          <div class="border px-4 py-2 text-sm">₹{{ maxPrice }}</div>
        </div>
      </div>

      <!-- Color Filter -->
      <div class="mb-6">
        <h3 class="text-lg font-semibold mb-2">Color</h3>
        <ul class="text-lg space-y-2">
          <li><input type="checkbox" class="mr-2"> Black</li>
          <li><input type="checkbox" class="mr-2"> Blue</li>
          <li><input type="checkbox" class="mr-2"> Green</li>
          <li><input type="checkbox" class="mr-2"> Pink</li>
          <li><input type="checkbox" class="mr-2"> Red</li>
        </ul>
      </div>
    </aside>

    <!-- Products Section -->
    <section class="w-full px-2">
      
      <!-- Top Sorting Bar -->
      <div class="w-full flex justify-between items-center mb-6 flex-wrap">
        <p class="text-xs sm:text-sm text-gray-500 whitespace-nowrap">
          Showing {{ filteredProducts.length }} of {{ products.length }} results
        </p>
        <div class="flex items-center gap-2 text-sm sm:text-sm text-xs mt-2 sm:mt-0">
          <span class="text-gray-500 whitespace-nowrap">Sort By:</span>
          <select class="border px-2 py-1 text-xs sm:text-sm">
            <option>Default sorting</option>
            <option>Price: Low to High</option>
            <option>Price: High to Low</option>
          </select>
        </div>
      </div>

      <!-- Product Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
        <div *ngFor="let product of filteredProducts" 
             class="border p-4 shadow-sm hover:shadow-md transition relative min-h-[420px]">

          <!-- Image -->
          <div class="relative">
            <img [src]="product.image" alt="{{ product.name }}" 
              class="w-full h-80 object-contain mx-auto mb-4 transition-transform duration-200 ease-in-out hover:scale-105" />
            
            <!-- Sale Tag -->
            <span *ngIf="product.sale" 
              class="absolute top-2 right-2 bg-gray-900 text-white px-3 py-1 text-[10px] font-bold uppercase shadow-md">
              Sale
            </span>
          </div>

          <!-- Details -->
          <div class="text-left">
            <h4 class="font-semibold text-lg mb-1">{{ product.name }}</h4>
            <p class="text-gray-600 text-base mb-4">₹{{ product.price }}.00</p>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-2 sm:space-x-3 mt-2">
              <button class="bg-gray-900 text-white p-2 hover:bg-black">
                <i class="fas fa-shopping-cart"></i>
              </button>
              <button class="bg-gray-900 text-white p-2 hover:bg-black">
                <i class="fas fa-heart"></i>
              </button>
              <button class="bg-gray-900 text-white p-2 hover:bg-black">
                <i class="fas fa-sync"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

    </section>
  </div>
</div>
