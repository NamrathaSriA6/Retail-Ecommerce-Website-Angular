<section class="bg-white pt-6">
  <!-- Banner -->
  <div class="relative">
    <img src="/assets/contactbanner.jpg" alt="Contact Banner" class="w-full h-64 object-cover">
    <h1 class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-3xl font-semibold text-black">Contact Us</h1>
  </div>

  <!-- Content Section -->
  <div class="max-w-7xl mx-auto px-4 py-10 grid grid-cols-1 md:grid-cols-3 gap-4">
    <!-- Form -->
    <div class="bg-gray-100 p-6 rounded-lg shadow">
      <h2 class="text-xl font-semibold mb-4">Send a message</h2>
      <form>
        <label class="block text-sm mb-1">Name</label>
        <input type="text" placeholder="Name" class="w-full p-2 mb-3 border border-gray-300 rounded">

        <label class="block text-sm mb-1">Email</label>
        <input type="email" placeholder="Email" class="w-full p-2 mb-3 border border-gray-300 rounded">

        <label class="block text-sm mb-1">Contact No</label>
        <input type="text" placeholder="Contact number" class="w-full p-2 mb-3 border border-gray-300 rounded">

        <label class="block text-sm mb-1">Message</label>
        <textarea placeholder="Message" rows="4" class="w-full p-2 mb-4 border border-gray-300 rounded"></textarea>

        <button type="submit" class="bg-lime-500 hover:bg-lime-600 text-white font-semibold px-6 py-2 rounded">SUBMIT</button>
      </form>
    </div>

    <!-- Follow Us -->
    <div class="bg-gray-100 p-6 rounded-lg shadow text-center">
      <h2 class="text-xl font-semibold mb-4">Follow Us</h2>
      <div class="flex justify-center space-x-4 text-xl mb-6">
        <i class="fab fa-facebook text-blue-700 hover:scale-110 transition cursor-pointer"></i>
        <i class="fab fa-twitter text-sky-500 hover:scale-110 transition cursor-pointer"></i>
        <i class="fab fa-youtube text-red-600 hover:scale-110 transition cursor-pointer"></i>
        <i class="fab fa-instagram text-pink-500 hover:scale-110 transition cursor-pointer"></i>
        <i class="fab fa-whatsapp text-green-600 hover:scale-110 transition cursor-pointer"></i>
      </div>

        <div class="text-sm space-y-6 text-center font-semibold">
        <div class="flex flex-col items-center">
            <i class="fas fa-map-marker-alt text-black text-2xl mb-2"></i>
            <p class="text-gray-800">1200 Market Street, Suite 400<br>San Francisco, CA 94102</p>
        </div>

        <div class="flex flex-col items-center">
            <i class="fas fa-envelope text-black text-2xl mb-2"></i>
            <p class="text-gray-800">{{mail}}</p>
        </div>

        <div class="flex flex-col items-center">
            <i class="fas fa-phone text-black text-2xl mb-2"></i>
            <p class="text-gray-800">+1 (888) 456-789<br>+1 (888) 333-000</p>
        </div>

        <div class="flex flex-col items-center">
            <i class="fas fa-clock text-black text-2xl mb-2"></i>
            <p class="text-gray-800">Open Time: 8:00AM - 6:00PM</p>
        </div>
        </div>
        </div>


    <!-- Image -->
    <div>
      <img src="/assets/cartboxes.jpg" alt="Contact" class="w-full h-full rounded-lg shadow object-cover">
    </div>
  </div>
  
</section>
