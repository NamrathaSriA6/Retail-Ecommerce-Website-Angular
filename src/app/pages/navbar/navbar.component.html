<!-- Main Navbar Wrapper -->
<div class="w-full border-b border-gray-200">
  <!-- Top Navbar -->
  <div class="flex items-center justify-between px-4 lg:px-8 py-4">
    
    <!-- Logo -->
    <div class="flex items-center space-x-2">
      <img src="/assets/logo.png" alt="Retail Logo" class="h-8" />
    </div>

    <!-- Navigation Links (Only visible on lg and above) -->
    <div class="hidden lg:flex space-x-16 text-gray-700 text-sm font-normal">
      <a href="#" class="hover:text-red-500">Home</a>
      <a href="/pages/shop" class="hover:text-red-500">Shop</a>
      <a href="/pages/newproduct" class="hover:text-red-500">New Products</a>
      <a href="/pages/bestdeals" class="hover:text-red-500">Best Deals</a>
      <a href="/pages/blog" class="hover:text-red-500">Blog</a>
      <a href="#" class="hover:text-red-500">About Us</a>
      <a routerLink="/pages/contactus" class="hover:text-red-500">Contact Us</a>
    </div>

    <!-- Icons + Hamburger -->
    <div class="flex items-center space-x-4 text-gray-700 text-xl">
      
      <!-- Hamburger Icon (mobile only) -->
      <button class="lg:hidden text-2xl focus:outline-none">
        <i class="fas fa-bars"></i>
      </button>

      <!-- Heart Icon -->
      <a routerLink="/pages/wishlist" class="cursor-pointer">
        <i class="far fa-heart cursor-pointer"></i>
      </a>

      <!-- User Icon -->
       <a routerLink="/login" class="cursor-pointer">
      <i class="far fa-user cursor-pointer"></i>
      </a>

      <!-- Cart Icon with badge -->
      <div class="relative cursor-pointer">
        <i class="fas fa-shopping-bag"></i>
        <div class="absolute -top-2 -right-3 bg-indigo-900 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full">1</div>
      </div>

      <!-- Price (only desktop) -->
      <span class="text-sm text-gray-600 hidden lg:inline">₹119.00</span>
    </div>
  </div>

  <!-- Search Bar Row -->
  <div class="flex flex-col lg:flex-row items-center justify-between px-4 lg:px-8 py-3 space-y-3 lg:space-y-0 border-t border-gray-200">

    <!-- All Categories (text hidden on mobile) -->
    <button class="hidden lg:inline flex items-center px-4 py-2 bg-indigo-900 text-white rounded-md space-x-2 text-sm">
      <i class="fas fa-bars"></i>
      <span>All Categories</span>
    </button>

    
    <div class="flex w-full lg:flex-1 lg:mx-4 border rounded overflow-hidden items-center">
      <select class="px-2 py-2 text-sm text-gray-600 border-r outline-none bg-white">
        <option>All</option>
      </select>
      <input type="text" placeholder="Search.." class="flex-1 px-2 py-2 text-sm outline-none" />
      <button class="bg-indigo-900 p-2 flex items-center justify-center h-full">
        <i class="fas fa-search text-white text-base"></i>
      </button>
    </div>


    <!-- Contact Info -->
    <div class="hidden lg:inline flex items-center space-x-2 text-sm text-gray-600">
      <i class="fas fa-phone-alt text-indigo-900"></i>
      <span>Call Us: 1800 090 0098</span>
    </div>
  </div>
</div>
